<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>WWN Character Sheet</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <main class="container">

        <h1>WWN Character Sheet</h1>

        <p class="subtitle">

            <p>

            <div class="actions">

                <a

                    href="/login"

                    Войти
                </a>

                <a
                    class="button secondary-link"
                    href="/register"
                >
                    Регистрация
                </a>

            </div>

        </div>

    </main>

</body>
</html>
